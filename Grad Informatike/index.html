<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatički 3D Grad</title>
    
    <!-- Glavni stilovi za sučelje (UI, kviz, gumbe) -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Učitavanje Three.js knjižnice preko CDN-a -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- (Opcionalno) GLTFLoader za učitavanje gotovih 3D modela zgrada (.glb/.gltf) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <!-- 1. SPREMNIK ZA 3D SVIJET (Canvas u kojem Three.js crta grad) -->
    <div id="game-container"></div>

    <!-- 2. KORISNIČKO SUČELJE (UI overlay) -->
    <!-- Bodovi i ime učenika -->
    <div id="ui-header">
        <div class="stat-box">UČENIK: <span id="player-name">Ivan</span></div>
        <div class="stat-box">BODOVI: <span id="score-val">0</span> ⭐</div>
    </div>

    <!-- Poruka i upute pri dnu ekrana -->
    <div id="instruction-banner">Koristi WASD ili strelice za kretanje po gradu!</div>

    <!-- Kontrole na dodir (za tablete i mobitele) -->
    <div id="touch-controls">
        <button class="touch-btn" id="btn-up">▲</button>
        <div class="touch-row">
            <button class="touch-btn" id="btn-left">◀</button>
            <button class="touch-btn" id="btn-down">▼</button>
            <button class="touch-btn" id="btn-right">▶</button>
        </div>
    </div>

    <!-- 3. DIJALOG PROZOR ZA KVIZ I ZADATKE (Iskoči pri ulasku u zgradu) -->
    <div id="quiz-modal" class="hidden">
        <div class="quiz-card">
            <h2 id="modal-title">Zadatak u zgradi</h2>
            <p id="modal-desc">Odgovori na pitanje za bodove:</p>
            
            <!-- Spremnik za pitanja i ponuđene odgovore -->
            <div id="question-box">
                <p id="question-text" class="question-title">Učitavanje pitanja...</p>
                <div id="options-container" class="options-grid">
                    <!-- Gumbi s odgovorima generiraju se dinamički iz JS/JSON-a -->
                </div>
            </div>

            <!-- Poruka o točnosti i gumb za zatvaranje -->
            <div id="feedback-box" class="hidden">
                <p id="feedback-msg"></p>
                <button id="btn-continue" onclick="zatvoriModal()">Nastavi istraživati</button>
            </div>
        </div>
    </div>

    <!-- 4. UČITAVANJE VAŠIH JAVASCRIPT SKRIPTI -->
    <!-- Učitavamo glavnu logiku igre -->
    <script src="js/quiz.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
