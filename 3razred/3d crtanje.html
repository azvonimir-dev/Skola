<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinkercad Kviz za 3. Razred</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border: 4px solid #3b82f6;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e40af;
            font-size: 26px;
            margin: 0 0 10px 0;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #3b82f6;
            transition: width 0.3s ease;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 17px;
            color: #334155;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .option-btn:hover {
            background-color: #e0f2fe;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #b91c1c;
        }

        .feedback {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }

        .feedback.correct-text {
            color: #16a34a;
        }

        .feedback.wrong-text {
            color: #dc2626;
        }

        .next-btn {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: background-color 0.2s;
        }

        .next-btn:hover {
            background-color: #2563eb;
        }

        /* Ekran na kraju */
        .result-screen {
            display: none;
            text-align: center;
        }

        .result-screen h2 {
            font-size: 28px;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #2563eb;
            margin: 20px 0;
        }

        .result-msg {
            font-size: 18px;
            color: #475569;
            margin-bottom: 25px;
        }

        .restart-btn {
            padding: 14px 28px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .restart-btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="header">
            <h1>🎮 Tinkercad Kviz 🚀</h1>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="stats-bar">
                <span id="question-count">Pitanje 1/15</span>
                <span id="score-count">Bodovi: 0</span>
            </div>
        </div>

        <div class="question-text" id="question-text">Pitanje se učitava...</div>
        <div class="options-grid" id="options-container"></div>
        <div class="feedback" id="feedback-text"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Sljedeće pitanje ➔</button>
    </div>

    <div class="result-screen" id="result-screen">
        <h2>Kviz je završen! 🎉</h2>
        <p>Tvoj konačni rezultat je:</p>
        <div class="score-display" id="final-score">0 / 15</div>
        <div class="result-msg" id="result-message">Bravo za trud!</div>
        <button class="restart-btn" onclick="restartQuiz()">Kreni ispočetka 🔄</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "Što upisujemo kako bismo ušli u našu razrednu grupu u Tinkercadu?",
            options: ["Kućnu adresu", "Kôd razreda (Class Code)", "Ime i prezime učiteljice"],
            correct: 1
        },
        {
            question: "Na kojemu se mjestu u Tinkercadu nalaze osnovni oblici (kocka, kugla, valjak...)?",
            options: ["U gornjem meniju", "S desne strane ekrana", "S lijeve strane ekrana"],
            correct: 1
        },
        {
            question: "Kako dovodimo novi oblik na radnu površinu?",
            options: ["Kliknemo na njega i povučemo ga mišom (Drag and Drop)", "Upišemo njegovo ime na tipkovnici", "DVOKLIKOM na oblik"],
            correct: 0
        },
        {
            question: "Što radimo s oblikom kada ga pretvorimo u 'Hole' (rupu)?",
            options: ["Obojimo ga u crvenu boju", "Pripremamo ga za bušenje rupe u drugom obliku", "Potpuno ga izbrišemo s ekrana"],
            correct: 1
        },
        {
            question: "Koji gumb moramo kliknuti kako bismo ruši/rupi i čvrstom obliku napravili pravu rupu?",
            options: ["Gumb za spajanje (Group)", "Gumb za brisanje (Delete)", "Gumb za okretanje (Rotate)"],
            correct: 0
        },
        {
            question: "Kako izgleda oblik koji je postavljen kao 'Hole' (rupa)?",
            options: ["Potpuno je crn", "Proziran je s sivim crtama", "Svijetli u mraku"],
            correct: 1
        },
        {
            question: "Pomoću čega možemo OKRETATI oblik u krug?",
            options: ["Pomoću male crne strelice koja gleda prema gore", "Pomoću zakrivljene dvostruke strelice", "Pomoću bijelih kvadratia"],
            correct: 1
        },
        {
            question: "Što radimo kada povučemo malu crnu strelicu (stožac) iznad oblika?",
            options: ["Okrećemo oblik u krug", "Podižemo oblik iznad radne površine", "Mijenjamo boju oblika"],
            correct: 1
        },
        {
            question: "Za što služe mali bijeli i crni kvadratići oko oblika?",
            options: ["Za promjenu veličine (širine, duljine i visine)", "Za brisanje oblika", "Za ulazak u Tinkercad"],
            correct: 0
        },
        {
            question: "Ako slučajno napraviš pogrešku u Tinkercadu, što trebaš kliknuti?",
            options: ["Strelicu natrag (Undo / Ponšti)", "Tipku za gašenje računala", "Gumb za izlazak iz razreda"],
            correct: 0
        },
        {
            question: "Što se dogodi kada spojiš (Grupiraš) crvenu kocku i žutu kuglu?",
            options: ["Eksplodiraju", "Postanu jedan zajednički oblik", "Nestanu s radne površine"],
            correct: 1
        },
        {
            question: "Kako se zove plava radna površina na kojoj gradimo modele?",
            options: ["Workplane (Radna ravnina)", "Playground (Igralište)", "Blackboard (Školska ploča)"],
            correct: 0
        },
        {
            question: "Možemo li promijeniti boju osnovnog oblika u Tinkercadu?",
            options: ["Ne, svi oblici moraju biti plavi", "Da, klikom na opciju 'Solid' pa odabirom boje", "Samo ako kupimo boju"],
            correct: 1
        },
        {
            question: "Što ti je potrebno za ulazak u Tinkercad razred osim Class Code-a?",
            options: ["Tvoja e-mail adresa", "Tvoj nadimak (Nickname) koji ti je dala učiteljica/učitelj", "Lozinka od tvojih roditelja"],
            correct: 1
        },
        {
            question: "Koju tipku na tipkovnici možemo stisnuti da brzo obrišemo označeni oblik?",
            options: ["Enter", "Space (Razmak)", "Delete (ili Backspace)"],
            correct: 2
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestionIndex];
        
        document.getElementById("question-count").innerText = `Pitanje ${currentQuestionIndex + 1}/${questions.length}`;
        document.getElementById("progress-bar").style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
        document.getElementById("question-text").innerText = q.question;
        
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        document.getElementById("feedback-text").innerText = "";
        document.getElementById("feedback-text").className = "feedback";
        document.getElementById("next-btn").style.display = "none";

        q.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = option;
            btn.onclick = () => selectOption(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, btnElement) {
        if (answered) return;
        answered = true;

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll(".option-btn");

        if (selectedIndex === q.correct) {
            score++;
            btnElement.classList.add("correct");
            document.getElementById("feedback-text").innerText = "Točno! Bravo! 👏";
            document.getElementById("feedback-text").classList.add("correct-text");
        } else {
            btnElement.classList.add("wrong");
            buttons[q.correct].classList.add("correct");
            document.getElementById("feedback-text").innerText = "Točan odgovor je označen zelenom bojom! 👍";
            document.getElementById("feedback-text").classList.add("wrong-text");
        }

        document.getElementById("score-count").innerText = `Bodovi: ${score}`;
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("progress-bar").style.width = "100%";
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        document.getElementById("final-score").innerText = `${score} / ${questions.length}`;

        let message = "";
        if (score === 15) {
            message = "Izvrsno! Ti si pravu majstor ili majstorica za Tinkercad! 🏆🌟";
        } else if (score >= 11) {
            message = "Odlično znanje! Vrlo dobro se snalaziš u Tinkercadu! 🚀";
        } else if (score >= 7) {
            message = "Dobar trud! Uz još malo vježbe bit ćeš izvrstan/na! 🛠️";
        } else {
            message = "Nemoj se brinuti! Ponovi gradivo i pokušaj ponovno! 💪";
        }
        document.getElementById("result-message").innerText = message;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById("score-count").innerText = "Bodovi: 0";
        document.getElementById("quiz-screen").style.display = "block";
        document.getElementById("result-screen").style.display = "none";
        loadQuestion();
    }

    // Pokreni kviz
    loadQuestion();
</script>

</body>
</html>
