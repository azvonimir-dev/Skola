        // Stanje aplikacije
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questionsData.length).fill(null);
        let score = 0;

        // Elementi sučelja
        const questionContainer = document.getElementById('question-container');
        const feedbackBox = document.getElementById('feedback-box');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score-display');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const badge = document.getElementById('question-type-badge');
        const questionsGrid = document.getElementById('questions-grid');
        const toggleGridBtn = document.getElementById('toggle-grid-btn');

        // Inicijalizacija pri učitavanju
        window.onload = function() {
            renderGridButtons();
            loadQuestion(currentQuestionIndex);
            updateHeader();

            prevBtn.addEventListener('click', goToPrev);
            nextBtn.addEventListener('click', goToNext);
            toggleGridBtn.addEventListener('click', toggleGrid);
        };

        // Prikaz mreže pitanja (indeks)
        function renderGridButtons() {
            questionsGrid.innerHTML = '';
            questionsData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.id = `grid-btn-${idx}`;
                btn.className = `w-7 h-7 text-xs font-bold rounded-lg border flex items-center justify-center transition ${
                    idx === currentQuestionIndex ? 'ring-2 ring-sky-500 scale-105' : ''
                } ${
                    userAnswers[idx] !== null 
                        ? (userAnswers[idx].isCorrect ? 'bg-green-500 text-white border-green-600' : 'bg-red-400 text-white border-red-500')
                        : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                }`;
                btn.innerText = idx + 1;
                btn.onclick = () => {
                    currentQuestionIndex = idx;
                    loadQuestion(currentQuestionIndex);
                };
                questionsGrid.appendChild(btn);
            });
        }

        function toggleGrid() {
            if (questionsGrid.classList.contains('hidden')) {
                questionsGrid.classList.remove('hidden');
                questionsGrid.classList.add('grid');
                toggleGridBtn.innerHTML = `<i class="fa-solid fa-chevron-up"></i> Sakrij sva pitanja`;
            } else {
                questionsGrid.classList.add('hidden');
                questionsGrid.classList.remove('grid');
                toggleGridBtn.innerHTML = `<i class="fa-solid fa-th"></i> Prikaži sva pitanja (1-60)`;
            }
        }

        // Učitavanje i prikaz pojedinog pitanja
        function loadQuestion(index) {
            const q = questionsData[index];
            hideFeedback();
            
            // Ažuriraj značku s tipom zadatka
            if (q.type === 'mcq') badge.innerText = "Višestruki izbor";
            else if (q.type === 'tf') badge.innerText = "Točno / Netočno";
            else if (q.type === 'sort') badge.innerText = "Razvrstavanje";
            else if (q.type === 'fill') badge.innerText = "Dopunjavanje";
            else if (q.type === 'puzzle') badge.innerText = "Interaktivna slagalica";

            let html = `<div class="animate-fade-in">`;
            html += `<h3 class="text-xs font-extrabold text-sky-500 tracking-wider uppercase mb-1">Pitanje ${index + 1} od 60</h3>`;
            html += `<h2 class="text-xl sm:text-2xl font-bold text-slate-800 mb-6 leading-snug">${q.question}</h2>`;

            // Ovisno o tipu pitanja generiraj kontrole
            if (q.type === 'mcq' || q.type === 'tf' || q.type === 'fill') {
                html += `<div class="grid grid-cols-1 gap-3">`;
                q.options.forEach((opt, optIdx) => {
                    const isSelected = userAnswers[index] && userAnswers[index].selected === optIdx;
                    const isAnswered = userAnswers[index] !== null;
                    let btnStyle = "bg-slate-50 hover:bg-sky-50 border-2 border-slate-200 text-slate-700";

                    if (isAnswered) {
                        if (optIdx === q.answer) {
                            btnStyle = "bg-green-100 border-2 border-green-500 text-green-800 font-bold";
                        } else if (isSelected && optIdx !== q.answer) {
                            btnStyle = "bg-red-100 border-2 border-red-400 text-red-800";
                        } else {
                            btnStyle = "bg-slate-50 border-2 border-slate-200 text-slate-400 opacity-60";
                        }
                    }

                    html += `
                        <button onclick="handleMultipleChoice(${optIdx})" ${isAnswered ? 'disabled' : ''} 
                            class="w-full text-left p-4 rounded-2xl transition-all duration-200 flex items-center justify-between font-semibold ${btnStyle}">
                            <span>${opt}</span>
                            ${isAnswered && optIdx === q.answer ? '<i class="fa-solid fa-circle-check text-green-600 text-xl"></i>' : ''}
                            ${isAnswered && isSelected && optIdx !== q.answer ? '<i class="fa-solid fa-circle-xmark text-red-500 text-xl"></i>' : ''}
                        </button>
                    `;
                });
                html += `</div>`;
            } 
            else if (q.type === 'sort') {
                const isAnswered = userAnswers[index] !== null;
                html += `<div class="space-y-4">`;
                q.items.forEach((item, itemIdx) => {
                    const userSel = isAnswered ? userAnswers[index].selected[itemIdx] : null;
                    html += `
                        <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-2">
                            <span class="font-bold text-slate-700">${item.text}</span>
                            <div class="flex gap-2">
                                <button onclick="handleSortSelect(${itemIdx}, 'osobni')" ${isAnswered ? 'disabled' : ''}
                                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                                        userSel === 'osobni'
                                            ? (item.category === 'osobni' ? 'bg-green-500 text-white border-green-600' : 'bg-red-500 text-white border-red-600')
                                            : 'bg-sky-50 hover:bg-sky-100 text-sky-700 border-sky-200'
                                    }">
                                    Osobni podatak
                                </button>
                                <button onclick="handleSortSelect(${itemIdx}, 'omiljeno')" ${isAnswered ? 'disabled' : ''}
                                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                                        userSel === 'omiljeno'
                                            ? (item.category === 'omiljeno' ? 'bg-green-500 text-white border-green-600' : 'bg-red-500 text-white border-red-600')
                                            : 'bg-purple-50 hover:bg-purple-100 text-purple-700 border-purple-200'
                                    }">
                                    Omiljena stvar
                                </button>
                            </div>
                        </div>
                    `;
                });
                if (!isAnswered) {
                    html += `<button onclick="checkSortAnswer()" class="mt-4 w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-2xl shadow transition">Potvrdi razvrstavanje</button>`;
                }
                html += `</div>`;
            }
            else if (q.type === 'puzzle') {
                const isAnswered = userAnswers[index] !== null;
                const currentOrder = isAnswered ? userAnswers[index].order : (q.currentOrder || [...q.puzzleItems].sort(() => Math.random() - 0.5));
                q.currentOrder = currentOrder;

                html += `<p class="text-xs text-slate-500 font-semibold mb-3">Klikni na dva koraka da im zamijeniš mjesta dok ne dobiješ točan redoslijed od 1 do 4!</p>`;
                html += `<div class="space-y-2.5" id="puzzle-list">`;
                currentOrder.forEach((itemText, pIdx) => {
                    const isSelectedForSwap = (tempPuzzleSelected === pIdx);
                    html += `
                        <div onclick="clickPuzzlePiece(${pIdx})" class="puzzle-piece p-3.5 rounded-2xl border-2 font-bold text-sm flex items-center justify-between ${
                            isSelectedForSwap ? 'bg-yellow-100 border-yellow-400 scale-102 shadow-md' : 'bg-amber-50 border-amber-200 text-amber-900'
                        } ${isAnswered ? 'pointer-events-none opacity-90' : ''}">
                            <span>${itemText}</span>
                            <i class="fa-solid fa-arrows-up-down text-amber-400"></i>
                        </div>
                    `;
                });
                html += `</div>`;

                if (!isAnswered) {
                    html += `<button onclick="checkPuzzleAnswer()" class="mt-5 w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-2xl shadow transition">Provjeri slagalicu</button>`;
                }
            }

            html += `</div>`;
            questionContainer.innerHTML = html;

            // Ako je već odgovoreno, prikaži povratnu informaciju
            if (userAnswers[index] !== null) {
                showFeedback(userAnswers[index].isCorrect, q.explanation);
            }

            updateNavButtons();
            updateHeader();
            renderGridButtons();
        }

        // Varijabla za privremeno označavanje u slagalici
        let tempSortAnswers = {};
        let tempPuzzleSelected = null;

        // Rukovanje standardnim pitanjima (MCQ, TF, Fill)
        function handleMultipleChoice(selectedOption) {
            const q = questionsData[currentQuestionIndex];
            const isCorrect = (selectedOption === q.answer);

            userAnswers[currentQuestionIndex] = {
                selected: selectedOption,
                isCorrect: isCorrect
            };

            if (isCorrect) score++;

            showFeedback(isCorrect, q.explanation);
            loadQuestion(currentQuestionIndex);
        }

        // Rukovanje Razvrstavanjem
        function handleSortSelect(itemIndex, category) {
            tempSortAnswers[itemIndex] = category;
            // Visual feedback temporary
            const q = questionsData[currentQuestionIndex];
            let allSelected = true;
            for(let i=0; i<q.items.length; i++) {
                if(!tempSortAnswers[i]) allSelected = false;
            }
            loadQuestion(currentQuestionIndex);
        }

        function checkSortAnswer() {
            const q = questionsData[currentQuestionIndex];
            let isCorrect = true;
            
            for (let i = 0; i < q.items.length; i++) {
                if (tempSortAnswers[i] !== q.items[i].category) {
                    isCorrect = false;
                    break;
                }
            }

            userAnswers[currentQuestionIndex] = {
                selected: { ...tempSortAnswers },
                isCorrect: isCorrect
            };

            if (isCorrect) score++;
            showFeedback(isCorrect, q.explanation);
            loadQuestion(currentQuestionIndex);
        }

        // Rukovanje Slagalicom (Puzzle)
        function clickPuzzlePiece(index) {
            const q = questionsData[currentQuestionIndex];
            if (userAnswers[currentQuestionIndex] !== null) return;

            if (tempPuzzleSelected === null) {
                tempPuzzleSelected = index;
            } else {
                // Zamijeni mjesta
                let temp = q.currentOrder[tempPuzzleSelected];
                q.currentOrder[tempPuzzleSelected] = q.currentOrder[index];
                q.currentOrder[index] = temp;
                tempPuzzleSelected = null;
            }
            loadQuestion(currentQuestionIndex);
        }

        function checkPuzzleAnswer() {
            const q = questionsData[currentQuestionIndex];
            let isCorrect = true;

            for (let i = 0; i < q.puzzleItems.length; i++) {
                if (q.currentOrder[i] !== q.puzzleItems[i]) {
                    isCorrect = false;
                    break;
                }
            }

            userAnswers[currentQuestionIndex] = {
                order: [...q.currentOrder],
                isCorrect: isCorrect
            };

            if (isCorrect) score++;
            showFeedback(isCorrect, q.explanation);
            loadQuestion(currentQuestionIndex);
        }

        // Prikaži povratnu informaciju
        function showFeedback(isCorrect, explanation) {
            feedbackBox.classList.remove('hidden', 'bg-green-50', 'border-green-200', 'text-green-900', 'bg-red-50', 'border-red-200', 'text-red-900');
            
            if (isCorrect) {
                feedbackBox.classList.add('bg-green-50', 'border-green-300', 'text-green-900');
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-check text-green-500"></i>`;
                feedbackTitle.innerText = "Točno! Odlično urađeno!";
            } else {
                feedbackBox.classList.add('bg-red-50', 'border-red-300', 'text-red-900');
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-500"></i>`;
                feedbackTitle.innerText = "Nije točno. Naučimo zašto:";
            }

            feedbackText.innerText = explanation;
        }

        function hideFeedback() {
            feedbackBox.classList.add('hidden');
        }

        // Navigacija
        function goToPrev() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                tempPuzzleSelected = null;
                tempSortAnswers = {};
                loadQuestion(currentQuestionIndex);
            }
        }

        function goToNext() {
            if (currentQuestionIndex < questionsData.length - 1) {
                currentQuestionIndex++;
                tempPuzzleSelected = null;
                tempSortAnswers = {};
                loadQuestion(currentQuestionIndex);
            } else {
                showFinalResults();
            }
        }

        function updateNavButtons() {
            prevBtn.disabled = (currentQuestionIndex === 0);
            
            if (currentQuestionIndex === questionsData.length - 1) {
                nextBtn.innerHTML = `Završi kviz <i class="fa-solid fa-trophy"></i>`;
                nextBtn.className = "bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-xl shadow-md transition flex items-center gap-2";
            } else {
                nextBtn.innerHTML = `Sljedeće <i class="fa-solid fa-arrow-right"></i>`;
                nextBtn.className = "bg-sky-500 hover:bg-sky-600 text-white font-bold px-6 py-2.5 rounded-xl shadow-md transition flex items-center gap-2";
            }
        }

        function updateHeader() {
            // Izračunaj bodove
            let calculatedScore = 0;
            userAnswers.forEach(ans => {
                if (ans && ans.isCorrect) calculatedScore++;
            });
            score = calculatedScore;

            scoreDisplay.innerText = `${score} / ${questionsData.length}`;
            progressText.innerText = `${currentQuestionIndex + 1} / ${questionsData.length}`;
            
            const pct = ((currentQuestionIndex + 1) / questionsData.length) * 100;
            progressBar.style.width = `${pct}%`;
        }

        // Prikaz završnih rezultata
        function showFinalResults() {
            const modal = document.getElementById('result-modal');
            const finalScore = document.getElementById('final-score');
            const finalPct = document.getElementById('final-percentage');
            const finalMsg = document.getElementById('final-message');

            const percentage = Math.round((score / questionsData.length) * 100);
            finalScore.innerText = `${score} / ${questionsData.length}`;
            finalPct.innerText = `${percentage}% točnosti`;

            if (percentage >= 90) {
                finalMsg.innerText = "🌟 Izvanredno! Ti si pravi majstor i čuvar sigurnosti na internetu!";
            } else if (percentage >= 70) {
                finalMsg.innerText = "👏 Vrlo dobro! Vrlo dobro poznaješ pravila i znaš kako čuvati svoje podatke!";
            } else if (percentage >= 50) {
                finalMsg.innerText = "Dobar trud! Dobro ti ide, ali ponovi još malo pravila o čuvanju lozinki i osobnih podataka.";
            } else {
                finalMsg.innerText = "💪 Nemoj se obeshrabriti! Riješi kviz ponovno i naučit ćeš sva važna pravila sigurnosti.";
            }

            modal.classList.remove('hidden');
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers = new Array(questionsData.length).fill(null);
            score = 0;
            tempPuzzleSelected = null;
            tempSortAnswers = {};

            document.getElementById('result-modal').classList.add('hidden');
            loadQuestion(currentQuestionIndex);
        }
    </script>
</body>
</html>
