<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Popis zadataka</title>
</head>
<body>

    <h2>Popis HTML zadataka:</h2>
    <ul id="popis"></ul>

    <script>
        // Samo promijenite ova 2 podatka:
        const korisnik = "VASE-KORISNICKO-IME";
        const repo = "VASE-SPREMITISTE";

        fetch(`https://api.github.com/repos/${korisnik}/${repo}/contents/`)
            .then(res => res.json())
            .then(files => {
                const ul = document.getElementById('popis');
                files.filter(f => f.name.endsWith('.html') && f.name !== 'index.html').forEach(f => {
                    ul.innerHTML += `<li><a href="${f.name}">${f.name}</a></li>`;
                });
            });
    </script>

</body>
</html>
