<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda IT Shop Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 950px;
            height: 580px;
            background: #1e293b;
            border: 6px solid #22c55e;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Zaglavlje */
        #top-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.9);
            padding: 10px 20px;
            border-radius: 14px;
            border: 2px solid #22c55e;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Kontrole na dodir za pametnu ploču / tablet */
        #touch-controls {
            width: 950px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
        }

        .ctrl-btn {
            background: #16a34a;
            border: 2px solid #86efac;
            color: white;
            font-size: 22px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #15803d;
        }

        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #15803d;
        }

        .action-btn {
            background: #eab308;
            border: 2px solid #fef08a;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 #ca8a04;
        }

        /* Preklapajući zasloni */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .overlay h1 {
            font-size: 42px;
            color: #4ade80;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(74,222,128,0.5);
        }

        .overlay p {
            font-size: 19px;
            max-width: 650px;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #cbd5e1;
        }

        .start-btn {
            background: #22c55e;
            color: white;
            font-size: 24px;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
        }

        .start-btn:hover {
            transform: scale(1.05);
            background: #16a34a;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Pokretni Zaslon -->
    <div id="start-screen" class="overlay">
        <h1>🐼 Panda IT Shop Simulator</h1>
        <p>1. Odi u 📦 <b>Skladište</b> (dolje lijevo) po kutije s robom.<br>
           2. Stani do 🖥️ <b>Police</b> da je napuniš.<br>
           3. Kada kupci uzmu robu, stani na 💵 <b>Blagajnu</b> (dolje desno) da uzmeš novac!</p>
        <button class="start-btn" onclick="startGame()">OTVORI TRGOVINU!</button>
    </div>

    <!-- Zaglavlje -->
    <div id="top-bar">
        <div class="stat-box">🪙 Novac: <span id="money">100</span> B</div>
        <div class="stat-box">📦 Teret: <span id="carrying">0 / 3</span></div>
        <div class="stat-box">🛒 Red na blagajni: <span id="queue-count">0</span></div>
    </div>

    <canvas id="shopCanvas" width="950" height="580"></canvas>
</div>

<!-- Kontrole ispod ekrana -->
<div id="touch-controls">
    <div class="dpad">
        <div></div>
        <div class="ctrl-btn" onmousedown="setKey('Up', true)" onmouseup="setKey('Up', false)" ontouchstart="setKey('Up', true); event.preventDefault();" ontouchend="setKey('Up', false)">⬆️</div>
        <div></div>
        <div class="ctrl-btn" onmousedown="setKey('Left', true)" onmouseup="setKey('Left', false)" ontouchstart="setKey('Left', true); event.preventDefault();" ontouchend="setKey('Left', false)">⬅️</div>
        <div class="ctrl-btn" onmousedown="setKey('Down', true)" onmouseup="setKey('Down', false)" ontouchstart="setKey('Down', true); event.preventDefault();" ontouchend="setKey('Down', false)">⬇️</div>
        <div class="ctrl-btn" onmousedown="setKey('Right', true)" onmouseup="setKey('Right', false)" ontouchstart="setKey('Right', true); event.preventDefault();" ontouchend="setKey('Right', false)">➡️</div>
    </div>
    <button class="action-btn" onclick="wakeWorker()">😴 Probudi Radnika!</button>
</div>

<script>
    const canvas = document.getElementById('shopCanvas');
    const ctx = canvas.getContext('2d');

    let money = 100;
    let cooldown = 0;
    const keys = { Up: false, Down: false, Left: false, Right: false };

    function setKey(k, val) { keys[k] = val; }

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = true;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = true;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
    });

    window.addEventListener('keyup', e => {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = false;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = false;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
    });

    const panda = { x: 450, y: 300, carrying: 0, maxCarry: 3, speed: 5 };
    const warehouse = { x: 50, y: 430, w: 140, h: 100, label: '📦 Skladište' };
    const register = { x: 760, y: 430, w: 140, h: 100, label: '💵 Blagajna' };

    const shelves = [
        { id: 'mouse', x: 250, y: 150, w: 130, h: 90, name: '🖱️ Miševi', count: 0, max: 5, price: 40, unlocked: true },
        { id: 'keyboard', x: 550, y: 150, w: 130, h: 90, name: '⌨️ Tipkovnice', count: 0, max: 5, price: 60, unlocked: true },
        { id: 'monitor', x: 250, y: 300, w: 130, h: 90, name: '🖥️ Monitori', count: 0, max: 5, price: 100, unlocked: false, cost: 200 }
    ];

    let customers = [];
    let queue = [];
    const AVATARS = ['🐰', '🦊', '🐻', '🐶'];

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        setInterval(gameLoop, 1000 / 60);
        setInterval(spawnCustomer, 3000);
    }

    function gameLoop() {
        update();
        render();
    }

    function update() {
        // Kretanje
        if (keys.Up && panda.y > 60) panda.y -= panda.speed;
        if (keys.Down && panda.y < 520) panda.y += panda.speed;
        if (keys.Left && panda.x > 60) panda.x -= panda.speed;
        if (keys.Right && panda.x < 890) panda.x += panda.speed;

        if (cooldown > 0) cooldown--;

        // Skladište
        if (isNear(panda, warehouse) && cooldown === 0) {
            if (panda.carrying < panda.maxCarry) {
                panda.carrying++;
                cooldown = 12;
                updateHud();
            }
        }

        // Police
        shelves.forEach(s => {
            if (s.unlocked) {
                if (isNear(panda, s) && panda.carrying > 0 && s.count < s.max && cooldown === 0) {
                    s.count++;
                    panda.carrying--;
                    cooldown = 12;
                    updateHud();
                }
            } else {
                if (isNear(panda, s) && money >= s.cost) {
                    money -= s.cost;
                    s.unlocked = true;
                    updateHud();
                }
            }
        });

        // Blagajna (Naplata)
        if (isNear(panda, register) && queue.length > 0) {
            queue.forEach(c => {
                money += c.price;
            });
            queue = [];
            updateHud();
        }

        // Kretanje Kupaca
        customers.forEach((c, idx) => {
            if (c.state === 'to_shelf') {
                moveTo(c, c.shelf.x + 65, c.shelf.y + 110);
                if (dist(c, { x: c.shelf.x + 65, y: c.shelf.y + 110 }) < 15) {
                    if (c.shelf.count > 0) {
                        c.shelf.count--;
                        c.price = c.shelf.price;
                        c.state = 'to_register';
                    } else {
                        customers.splice(idx, 1);
                    }
                }
            } else if (c.state === 'to_register') {
                moveTo(c, register.x + 70, register.y - 30);
                if (dist(c, { x: register.x + 70, y: register.y - 30 }) < 20) {
                    queue.push(c);
                    customers.splice(idx, 1);
                    updateHud();
                }
            }
        });
    }

    function spawnCustomer() {
        const activeShelves = shelves.filter(s => s.unlocked && s.count > 0);
        if (activeShelves.length === 0 || customers.length >= 3) return;

        const target = activeShelves[Math.floor(Math.random() * activeShelves.length)];
        customers.push({
            x: 880, y: 80,
            icon: AVATARS[Math.floor(Math.random() * AVATARS.length)],
            shelf: target,
            state: 'to_shelf',
            price: 0
        });
    }

    function moveTo(obj, tx, ty) {
        const dx = tx - obj.x;
        const dy = ty - obj.y;
        const d = Math.hypot(dx, dy);
        if (d > 2) {
            obj.x += (dx / d) * 3;
            obj.y += (dy / d) * 3;
        }
    }

    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    function isNear(p, rect) {
        return p.x > rect.x - 30 && p.x < rect.x + rect.w + 30 &&
               p.y > rect.y - 30 && p.y < rect.y + rect.h + 30;
    }

    function updateHud() {
        document.getElementById('money').innerText = money;
        document.getElementById('carrying').innerText = `${panda.carrying} / ${panda.maxCarry}`;
        document.getElementById('queue-count').innerText = queue.length;
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Pod
        ctx.fillStyle = '#334155';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Skladište
        ctx.fillStyle = '#475569';
        ctx.fillRect(warehouse.x, warehouse.y, warehouse.w, warehouse.h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Arial';
        ctx.fillText(warehouse.label, warehouse.x + 20, warehouse.y + 55);

        // Blagajna
        ctx.fillStyle = '#eab308';
        ctx.fillRect(register.x, register.y, register.w, register.h);
        ctx.fillStyle = '#000';
        ctx.fillText(register.label, register.x + 25, register.y + 55);

        // Police
        shelves.forEach(s => {
            if (s.unlocked) {
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 3;
                ctx.fillRect(s.x, s.y, s.w, s.h);
                ctx.strokeRect(s.x, s.y, s.w, s.h);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 15px Arial';
                ctx.fillText(s.name, s.x + 10, s.y + 35);
                ctx.fillText(`Puno: ${s.count} / ${s.max}`, s.x + 10, s.y + 65);
            } else {
                ctx.fillStyle = 'rgba(234, 179, 8, 0.15)';
                ctx.strokeStyle = '#eab308';
                ctx.fillRect(s.x, s.y, s.w, s.h);
                ctx.strokeRect(s.x, s.y, s.w, s.h);
                ctx.fillStyle = '#eab308';
                ctx.font = 'bold 14px Arial';
                ctx.fillText(`🔓 Otključaj`, s.x + 20, s.y + 40);
                ctx.fillText(`${s.cost} B`, s.x + 40, s.y + 65);
            }
        });

        // Kupci u pokretu
        customers.forEach(c => {
            ctx.font = '32px Arial';
            ctx.fillText(c.icon, c.x, c.y);
        });

        // Kupci u redu na blagajni
        queue.forEach((q, idx) => {
            ctx.font = '32px Arial';
            ctx.fillText(q.icon, register.x + 20 + (idx * 30), register.y - 15);
        });

        // Panda Igrač
        ctx.font = '40px Arial';
        ctx.fillText('🐼', panda.x - 20, panda.y + 15);

        if (panda.carrying > 0) {
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`📦 x${panda.carrying}`, panda.x - 15, panda.y - 25);
        }
    }
</script>

</body>
</html>
