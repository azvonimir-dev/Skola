<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatički Bajt Kliker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 1000px;
            height: 650px;
            background: rgba(30, 41, 59, 0.9);
            border: 6px solid #38bdf8;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Lijeva strana: Kliker zona */
        #clicker-zone {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 3px solid rgba(56, 189, 248, 0.3);
            background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
            position: relative;
        }

        .score-display {
            font-size: 38px;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            margin-bottom: 5px;
            text-align: center;
        }

        .bps-display {
            font-size: 20px;
            color: #a7f3d0;
            margin-bottom: 30px;
            font-weight: 600;
        }

        #big-pc {
            font-size: 130px;
            cursor: pointer;
            transition: transform 0.08s ease;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
            border-radius: 50%;
            padding: 20px;
        }

        #big-pc:active {
            transform: scale(0.88);
        }

        /* Desna strana: Shop s nadogradnjama */
        #shop-zone {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: rgba(15, 23, 42, 0.5);
            overflow-y: auto;
        }

        .shop-title {
            font-size: 24px;
            font-weight: bold;
            color: #facc15;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #facc15;
            padding-bottom: 8px;
        }

        .upgrade-card {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upgrade-card:hover {
            background: #334155;
            transform: translateX(4px);
        }

        .upgrade-card.disabled {
            opacity: 0.4;
            pointer-events: none;
            border-color: #64748b;
        }

        .upgrade-icon {
            font-size: 40px;
            margin-right: 15px;
        }

        .upgrade-info {
            flex: 1;
        }

        .upgrade-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }

        .upgrade-effect {
            font-size: 13px;
            color: #38bdf8;
        }

        .upgrade-cost {
            font-size: 16px;
            font-weight: bold;
            color: #facc15;
            background: rgba(250, 204, 21, 0.1);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid #facc15;
        }

        .upgrade-count {
            font-size: 22px;
            font-weight: 800;
            color: #a7f3d0;
            margin-left: 15px;
            min-width: 35px;
            text-align: right;
        }

        /* Pop-up brojevi pri kliku */
        .click-text {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Kliker Zona -->
    <div id="clicker-zone">
        <div class="score-display"><span id="bytes-count">0</span> Bajtova</div>
        <div class="bps-display">⚡ <span id="bps-count">0</span> B/s (u sekundi)</div>
        
        <div id="big-pc" onclick="clickPC(event)">🖥️</div>
        
        <p style="margin-top: 25px; color: #94a3b8; font-size: 15px;">Klikni na računalo za zaradu Bajtova!</p>
    </div>

    <!-- Shop Zona sa nadogradnjama -->
    <div id="shop-zone">
        <div class="shop-title">🛒 Informatičke Nadogradnje</div>
        <div id="upgrades-list">
            <!-- Nadogradnje se učitavaju iz JS-a -->
        </div>
    </div>
</div>
