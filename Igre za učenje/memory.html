<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatički Memory</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #game-container {
            width: 100%;
            max-width: 950px;
            background: #1e293b;
            border: 5px solid #38bdf8;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            padding: 15px;
            align-items: center;
            position: relative;
        }

        /* Zaglavlje i kontrole */
        #top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.8);
            padding: 10px 15px;
            border-radius: 12px;
            border: 2px solid #38bdf8;
        }

        .stats-group {
            display: flex;
            gap: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #38bdf8;
        }

        .difficulty-group {
            display: flex;
            gap: 8px;
        }

        .diff-btn {
            background: #334155;
            border: 2px solid #38bdf8;
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .diff-btn:hover {
            background: #0284c7;
        }

        .diff-btn.active {
            background: #0284c7;
            border-color: #facc15;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }

        /* Rešetka s karticama */
        #grid-container {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: 850px;
            max-height: 70vh;
            justify-center: center;
            align-content: center;
            overflow-y: auto;
            padding: 5px;
        }

        /* Prilagodba veličina kartica ovisno o mrežama */
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-8 { grid-template-columns: repeat(8, 1fr); }
        .grid-16 { grid-template-columns: repeat(16, 1fr); }

        .card {
            aspect-ratio: 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: 10px;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card-front {
            background: linear-gradient(135deg, #0284c7, #1e3a8a);
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
        }

        .card-back {
            background: #ffffff;
            color: #0f172a;
            transform: rotateY(180deg);
            border-color: #facc15;
        }

        /* Prilagodba fonta na karticama ovisno o mreži */
        .grid-4 .card-icon { font-size: 45px; }
        .grid-4 .card-name { font-size: 13px; font-weight: bold; }
        
        .grid-8 .card-icon { font-size: 24px; }
        .grid-8 .card-name { font-size: 9px; display: none; } /* Sakrij tekst na većim rešetkama radi preglednosti */

        .grid-16 .card-icon { font-size: 14px; }
        .grid-16 .card-name { display: none; }

        .card.matched .card-back {
            background: #bbf7d0;
            border-color: #22c55e;
            opacity: 0.85;
        }

        /* Modal za kraj igre */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 16px;
            text-align: center;
            padding: 20px;
        }

        .overlay h1 {
            font-size: 38px;
            color: #facc15;
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 20px;
            margin-bottom: 20px;
            color: #cbd5e1;
        }

        .start-btn {
            background: #22c55e;
            color: white;
            font-size: 22px;
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: transform 0.1s;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Pokretni i Završni Zaslon -->
    <div id="end-screen" class="overlay" style="display: none;">
        <h1>🎉 ODLIČNO OBRANJENO!</h1>
        <p id="end-msg">Pronašli ste sve parove!</p>
        <button class="start-btn" onclick="initGame()">IGRAJ PONOVNO</button>
    </div>

    <!-- Kontrole i statistika -->
    <div id="top-bar">
        <div class="difficulty-group">
            <button class="diff-btn active" onclick="setDifficulty(4)">4x4 (Lako)</button>
            <button class="diff-btn" onclick="setDifficulty(8)">8x8 (Srednje)</button>
            <button class="diff-btn" onclick="setDifficulty(16)">16x16 (Teško)</button>
        </div>
        <div class="stats-group">
            <div class="stat-item">⏱️ Vrijeme: <span id="timer">0</span>s</div>
            <div class="stat-item">🔄 Potezi: <span id="moves">0</span></div>
            <div class="stat-item">⭐ Parovi: <span id="pairs-count">0/8</span></div>
        </div>
    </div>

    <!-- Mreža s karticama -->
    <div id="grid-container" class="grid-4"></div>
</div>

<script>
    // Audio zvučni efekti
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'flip') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'match') {
            osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'win') {
            osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.15);
            osc.frequency.setValueAtTime(783, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
    }

    // Baza informatičkih motiva
    const IT_ITEMS = [
        { icon: '🖥️', name: 'Monitor' }, { icon: '⌨️', name: 'Tipkovnica' },
        { icon: '🖱️', name: 'Miš' }, { icon: '💻', name: 'Laptop' },
        { icon: '🤖', name: 'Robot' }, { icon: '⚡', name: 'Procesor' },
        { icon: '📱', name: 'Tablet' }, { icon: '🎧', name: 'Slušalice' },
        { icon: '🖨️', name: 'Printer' }, { icon: '🔊', name: 'Zvučnik' },
        { icon: '🎮', name: 'Gamepad' }, { icon: '🌐', name: 'Internet' },
        { icon: '🔑', name: 'Lozinka' }, { icon: '💾', name: 'Disk' },
        { icon: '📷', name: 'Kamera' }, { icon: '🔋', name: 'Baterija' },
        { icon: '🔌', name: 'Kabel' }, { icon: '☁️', name: 'Cloud' },
        { icon: '🧠', name: 'RAM' }, { icon: '💳', name: 'Grafička' },
        { icon: '🕹️', name: 'Palica' }, { icon: '📡', name: 'Wi-Fi' },
        { icon: '📀', name: 'CD' }, { icon: '📁', name: 'Mapa' },
        { icon: '✉️', name: 'E-pošta' }, { icon: '🔒', name: 'Zaštita' },
        { icon: '🐛', name: 'Bug' }, { icon: '🚀', name: 'Lansiranje' },
        { icon: '🛠️', name: 'Servis' }, { icon: '💡', name: 'Ideja' },
        { icon: '⏰', name: 'Sat' }, { icon: '🎨', name: 'Crtanje' }
    ];

    let currentGridSize = 4; // 4x4 zadano
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let totalPairs = 8;
    let moves = 0;
    let seconds = 0;
    let timerInterval;
    let isLockBoard = false;

    function setDifficulty(size) {
        currentGridSize = size;
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        initGame();
    }

    function initGame() {
        clearInterval(timerInterval);
        seconds = 0;
        moves = 0;
        matchedPairs = 0;
        flippedCards = [];
        isLockBoard = false;

        totalPairs = (currentGridSize * currentGridSize) / 2;

        document.getElementById('timer').innerText = seconds;
        document.getElementById('moves').innerText = moves;
        document.getElementById('pairs-count').innerText = `${matchedPairs}/${totalPairs}`;
        document.getElementById('end-screen').style.display = 'none';

        const gridContainer = document.getElementById('grid-container');
        gridContainer.className = `grid-${currentGridSize}`;
        gridContainer.innerHTML = '';

        // Izaberi i udvostruči motive
        let selectedItems = [];
        while (selectedItems.length < totalPairs) {
            const item = IT_ITEMS[selectedItems.length % IT_ITEMS.length];
            selectedItems.push(item);
        }

        // Dupliranje i nasumično miješanje
        let cardDeck = [...selectedItems, ...selectedItems].sort(() => Math.random() - 0.5);

        // Stvaranje kartica na ekranu
        cardDeck.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.index = index;
            card.dataset.name = item.name;

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">❓</div>
                    <div class="card-back">
                        <span class="card-icon">${item.icon}</span>
                        <span class="card-name">${item.name}</span>
                    </div>
                </div>
            `;

            card.onclick = () => flipCard(card);
            gridContainer.appendChild(card);
        });

        // Pokreni mjerat vremena
        timerInterval = setInterval(() => {
            seconds++;
            document.getElementById('timer').innerText = seconds;
        }, 1000);
    }

    function flipCard(card) {
        if (isLockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

        playSfx('flip');
        card.classList.add('flipped');
        flippedCards.push(card);

        if (flippedCards.length === 2) {
            moves++;
            document.getElementById('moves').innerText = moves;
            checkMatch();
        }
    }

    function checkMatch() {
        isLockBoard = true;
        const [card1, card2] = flippedCards;

        if (card1.dataset.name === card2.dataset.name) {
            // Pogodak!
            setTimeout(() => {
                playSfx('match');
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                document.getElementById('pairs-count').innerText = `${matchedPairs}/${totalPairs}`;
                flippedCards = [];
                isLockBoard = false;

                if (matchedPairs === totalPairs) {
                    endGame();
                }
            }, 300);
        } else {
            // Nije pogodak - okreni natrag
            setTimeout(() => {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                flippedCards = [];
                isLockBoard = false;
            }, 900);
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        playSfx('win');
        
        document.getElementById('end-screen').style.display = 'flex';
        document.getElementById('end-msg').innerText = `Čestitamo! Pronašli ste sve parove na mreži ${currentGridSize}x${currentGridSize} za ${seconds} sekundi i ${moves} poteza!`;
    }

    // Početno pokretanje
    initGame();
</script>

</body>
</html>
