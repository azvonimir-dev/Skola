<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatički Slagač: Pronađi Mjesto</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 1000px;
            height: 650px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 6px solid #3b82f6;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Zaglavlje */
        #top-bar {
            height: 70px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            border-bottom: 3px solid #3b82f6;
        }

        .stat-box {
            background: #1e293b;
            padding: 8px 20px;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Glavni radni prostor */
        #main-workspace {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        /* Zona s dijelovima (polica) */
        #parts-dock {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 3px dashed rgba(56, 189, 248, 0.3);
            border-radius: 15px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            align-content: center;
        }

        .dock-item {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dock-item:hover {
            background: #334155;
            transform: scale(1.05);
        }

        .dock-item.selected {
            border-color: #f59e0b;
            background: #451a03;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }

        .dock-item.placed {
            opacity: 0.3;
            pointer-events: none;
            border-color: #64748b;
        }

        .item-icon {
            font-size: 36px;
            margin-bottom: 5px;
        }

        .item-name {
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        /* Zona kućišta sa siluetama */
        #pc-board {
            flex: 1.2;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid #3b82f6;
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
            padding: 15px;
            position: relative;
        }

        .slot {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slot:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }

        .slot.filled {
            border-style: solid;
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
            pointer-events: none;
        }

        .slot-silhouette {
            font-size: 28px;
            opacity: 0.4;
        }

        .slot-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
            text-align: center;
        }

        /* Preklapajući zasloni (Start / Kraj) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .overlay h1 {
            font-size: 42px;
            color: #38bdf8;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(56,189,248,0.5);
        }

        .overlay p {
            font-size: 20px;
            max-width: 600px;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #cbd5e1;
        }

        .start-btn {
            background: #2563eb;
            color: white;
            font-size: 26px;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
            font-weight: bold;
            transition: transform 0.1s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            background: #3b82f6;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Početni Zaslon -->
    <div id="start-screen" class="overlay">
        <h1>🧩 Informatički Slagač: Pronađi Mjesto!</h1>
        <p>Pomozi složiti računalo! Klikni na dio računala s lijeve strane, a zatim klikni na njegovu isprekidanu siluetu s desne strane gdje taj dio pripada.</p>
        <button class="start-btn" onclick="startGame()">IGRAJ IGRE!</button>
    </div>

    <!-- Završni Zaslon -->
    <div id="end-screen" class="overlay" style="display: none;">
        <h1 id="end-title">🎉 Bravo, Majstore!</h1>
        <p id="end-msg">Uspješno si složio cijelo računalo!</p>
        <button class="start-btn" onclick="startGame()">IGRAJ PONOVNO</button>
    </div>

    <!-- Zaglavlje -->
    <div id="top-bar">
        <div class="stat-box">⭐ Bodovi: <span id="score">0</span></div>
        <div class="stat-box">⏱️ Vrijeme: <span id="timer">0</span>s</div>
        <div class="stat-box">🧩 Složeno: <span id="placed-count">0</span> / 8</div>
    </div>

    <!-- Glavni radni prostor -->
    <div id="main-workspace">
        <!-- Polica s dijelovima -->
        <div id="parts-dock">
            <!-- Generira se putem JS-a -->
        </div>

        <!-- Kućište sa siluetama -->
        <div id="pc-board">
            <!-- Generira se putem JS-a -->
        </div>
    </div>
</div>

<script>
    // Zvučni efekti putem Web Audio API-ja
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'select') {
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'success') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }
    }

    const PARTS = [
        { id: 'motherboard', name: 'Matična Ploča', icon: '🟫', silhouette: '🔲' },
        { id: 'cpu', name: 'Procesor', icon: '⚡', silhouette: '🔋' },
        { id: 'ram', name: 'RAM Memorija', icon: '🧠', silhouette: '📌' },
        { id: 'gpu', name: 'Grafička Kartica', icon: '💳', silhouette: '🕹️' },
        { id: 'monitor', name: 'Monitor', icon: '🖥️', silhouette: '🖼️' },
        { id: 'keyboard', name: 'Tipkovnica', icon: '⌨️', silhouette: '🔤' },
        { id: 'mouse', name: 'Miš', icon: '🖱️', silhouette: '📍' },
        { id: 'speakers', name: 'Zvučnici', icon: '🔊', silhouette: '📻' }
    ];

    let score = 0;
    let seconds = 0;
    let timerInterval;
    let selectedPartId = null;
    let placedCount = 0;
    let shuffledParts = [];
    let shuffledSlots = [];

    function startGame() {
        score = 0;
        seconds = 0;
        placedCount = 0;
        selectedPartId = null;

        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = seconds;
        document.getElementById('placed-count').innerText = placedCount;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';

        // Priprema nasumičnog rasporeda za izazov
        shuffledParts = [...PARTS].sort(() => Math.random() - 0.5);
        shuffledSlots = [...PARTS].sort(() => Math.random() - 0.5);

        renderDock();
        renderBoard();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            seconds++;
            document.getElementById('timer').innerText = seconds;
        }, 1000);
    }

    function renderDock() {
        const dock = document.getElementById('parts-dock');
        dock.innerHTML = '';

        shuffledParts.forEach(part => {
            const item = document.createElement('div');
            item.className = 'dock-item' + (selectedPartId === part.id ? ' selected' : '');
            item.id = `dock-${part.id}`;
            item.innerHTML = `
                <div class="item-icon">${part.icon}</div>
                <div class="item-name">${part.name}</div>
            `;
            item.onclick = () => selectPart(part.id);
            dock.appendChild(item);
        });
    }

    function renderBoard() {
        const board = document.getElementById('pc-board');
        board.innerHTML = '';

        shuffledSlots.forEach(slotData => {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.id = `slot-${slotData.id}`;
            slot.innerHTML = `
                <div class="slot-silhouette">${slotData.silhouette}</div>
                <div class="slot-label">${slotData.name}</div>
            `;
            slot.onclick = () => placePart(slotData.id);
            board.appendChild(slot);
        });
    }

    function selectPart(id) {
        // Provjeri je li dio već postavljen
        const dockItem = document.getElementById(`dock-${id}`);
        if (dockItem.classList.contains('placed')) return;

        selectedPartId = id;
        playSound('select');
        renderDock();
    }

    function placePart(slotId) {
        if (!selectedPartId) {
            playSound('error');
            return;
        }

        if (selectedPartId === slotId) {
            // Točan pogodak!
            playSound('success');
            score += 50;
            placedCount++;

            document.getElementById('score').innerText = score;
            document.getElementById('placed-count').innerText = placedCount;

            // Označi dio kao postavljen
            const dockItem = document.getElementById(`dock-${selectedPartId}`);
            dockItem.classList.add('placed');
            dockItem.classList.remove('selected');

            // Popuni siluetu u kućištu
            const slot = document.getElementById(`slot-${slotId}`);
            slot.classList.add('filled');
            const partObj = PARTS.find(p => p.id === slotId);
            slot.innerHTML = `
                <div style="font-size: 32px;">${partObj.icon}</div>
                <div class="slot-label" style="color: #22c55e; font-weight: bold;">Složeno!</div>
            `;

            selectedPartId = null;

            // Provjera kraja igre
            if (placedCount === PARTS.length) {
                endGame();
            }
        } else {
            // Krivo mjesto
            playSound('error');
            const slot = document.getElementById(`slot-${slotId}`);
            slot.style.borderColor = '#ef4444';
            setTimeout(() => {
                slot.style.borderColor = '';
            }, 400);
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('end-screen').style.display = 'flex';
        document.getElementById('end-msg').innerText = `Odlično! Uspješno si složio računalo za ${seconds} sekundi i osvojio ${score} bodova!`;
    }
</script>

</body>
</html>
