<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidencija pluseva i minusa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f8;
            color: #333;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 10px;
            vertical-align: top;
        }
        th {
            background-color: #34495e;
            color: white;
            text-align: center;
        }
        .center {
            text-align: center;
        }
        button {
            padding: 5px 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            margin: 2px;
        }
        .btn-plus {
            background-color: #2ecc71;
            color: white;
        }
        .btn-minus {
            background-color: #e74c3c;
            color: white;
        }
        .btn-plus:hover { background-color: #27ae60; }
        .btn-minus:hover { background-color: #c0392b; }
        .log-list {
            font-size: 12px;
            color: #555;
            margin-top: 5px;
            max-height: 80px;
            overflow-y: auto;
        }
        .log-item {
            padding: 2px 0;
            border-bottom: 1px dashed #eee;
        }
        .badge {
            font-weight: bold;
            font-size: 16px;
        }
        .badge-plus { color: #27ae60; }
        .badge-minus { color: #c0392b; }
    </style>
</head>
<body>

    <h2>Evidencija pluseva i minusa</h2>

    <table>
        <thead>
            <tr>
                <th>R. br.</th>
                <th>Prezime</th>
                <th>Ime</th>
                <th>Plusevi (+)</th>
                <th>Minusi (-)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Podaci će se automatski učitati iz JavaScripta -->
        </tbody>
    </table>

    <script>
        const ucenici = [
            { id: 1, prezime: "Blažičević", ime: "Stjepan" },
            { id: 2, prezime: "Bošnjak", ime: "Marta" },
            { id: 3, prezime: "Cvjetojević", ime: "Jan" },
            { id: 4, prezime: "Devčić", ime: "Lara" },
            { id: 5, prezime: "Franjetić", ime: "Lovro" },
            { id: 6, prezime: "Gašpar", ime: "Greta" },
            { id: 7, prezime: "Keleminec", ime: "Željko" },
            { id: 8, prezime: "Mijoković", ime: "Doris" },
            { id: 9, prezime: "Palačković", ime: "Laura" },
            { id: 10, prezime: "Puljić", ime: "Pia" },
            { id: 11, prezime: "Šedevi Čolić", ime: "Faustina" },
            { id: 12, prezime: "Špiranec", ime: "Marta" },
            { id: 13, prezime: "Štimac", ime: "Jakov" },
            { id: 14, prezime: "Vidović", ime: "Brigita" },
            { id: 15, prezime: "Vukušić", ime: "Niko" }
        ];

        function renderTable() {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            ucenici.forEach(ucenik => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td class="center">${ucenik.id}</td>
                    <td>${ucenik.prezime}</td>
                    <td>${ucenik.ime}</td>
                    <td>
                        <button class="btn-plus" onclick="dodajZapis(${ucenik.id}, 'plus')">+ Dodaj plus</button>
                        <div class="log-list" id="plus-log-${ucenik.id}"></div>
                    </td>
                    <td>
                        <button class="btn-minus" onclick="dodajZapis(${ucenik.id}, 'minus')">- Dodaj minus</button>
                        <div class="log-list" id="minus-log-${ucenik.id}"></div>
                    </td>
                `;

                tbody.appendChild(row);
            });
        }

        function dodajZapis(id, tip) {
            const sada = new Date();
            const datumVrijeme = sada.toLocaleDateString('hr-HR') + ' ' + sada.toLocaleTimeString('hr-HR', { hour: '2-digit', minute: '2-digit' });
            
            const logDiv = document.getElementById(`${tip}-log-${id}`);
            const noviUnos = document.createElement("div");
            noviUnos.className = "log-item";
            
            if (tip === 'plus') {
                noviUnos.innerHTML = `<span class="badge badge-plus">+</span> [${datumVrijeme}]`;
            } else {
                noviUnos.innerHTML = `<span class="badge badge-minus">-</span> [${datumVrijeme}]`;
            }

            logDiv.appendChild(noviUnos);
        }

        // Inicijalno prikazivanje tablice
        renderTable();
    </script>

</body>
</html>
